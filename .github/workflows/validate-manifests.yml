name: Validate manifests

on:
  push:
  pull_request:

jobs:
  validate:
    name: Validate plugin, MCP, and registry manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ajv-cli
        run: npm install --global ajv-cli@5.0.0 ajv-formats@3.0.1

      - name: Fetch pinned schemas
        run: |
          mkdir -p .ci-schemas
          curl -fsSL https://agent-plugins.org/schemas/1.0.0/plugin.schema.json -o .ci-schemas/plugin.schema.json
          curl -fsSL https://agent-plugins.org/schemas/1.0.0/mcp.schema.json -o .ci-schemas/mcp.schema.json
          curl -fsSL https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json -o .ci-schemas/server.schema.json

      - name: Validate plugin.json
        run: |
          ajv validate \
            --spec=draft2020 \
            -c ajv-formats \
            -s .ci-schemas/plugin.schema.json \
            -d plugin.json

      - name: Validate mcp.json
        run: |
          ajv validate \
            --spec=draft2020 \
            -c ajv-formats \
            -s .ci-schemas/mcp.schema.json \
            -d mcp.json

      - name: Validate server.json
        run: |
          ajv validate \
            --spec=draft7 \
            --strict=false \
            -c ajv-formats \
            -s .ci-schemas/server.schema.json \
            -d server.json
